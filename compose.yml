services:
  web:
    image: httpd:2.4-alpine
    container_name: technova-web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./html:/usr/local/apache2/htdocs:ro
  kuma:
    image: louislam/uptime-kuma:1
    container_name: technova-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./kuma-data:/app/data
