<title>LF10 – Microcloud-Stack mit Git, GitHub und CI</title>
<style>:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface2: #f0eee9;
  --ink: #1a1a18; --muted: #6b6a64;
  --line: rgba(0,0,0,.10); --line2: rgba(0,0,0,.18);
  --accent: #4f46e5; --ok: #16a34a; --wip: #eab308; --todo: #94a3b8; --danger: #dc2626;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  --pad-x: 22px; /* horizontaler Seitenabstand, im Mobil-Breakpoint reduziert */
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18181b; --surface: #27272a; --surface2: #1f1f22;
    --ink: #e4e4e7; --muted: #a1a1aa;
    --line: rgba(255,255,255,.10); --line2: rgba(255,255,255,.20);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
#app { max-width: 1400px; margin: 0 auto; }
.app-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px var(--pad-x) 6px; }
.app-header-text { min-width: 0; }
.app-header-aside { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.app-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.app-header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

/* Timer */
#timerBanner {
  display: none; align-items: center; gap: 7px;
  background: var(--accent); color: #fff; padding: 5px 10px; border-radius: 99px;
  font-size: 12px; max-width: 340px;
}
#timerBanner .elapsed { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
#timerBanner .tb-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#timerBanner .stop-btn {
  background: rgba(255,255,255,.22); border: 0; color: #fff;
  padding: 2px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1.4; flex-shrink: 0;
}

/* Tabs */
.tabs { display: flex; gap: 2px; padding: 6px var(--pad-x) 0; border-bottom: 1px solid var(--line); }
.tab {
  padding: 9px 18px; font-size: 13px; font-weight: 600; border: 0; background: none;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px var(--pad-x); align-items: center; }
.search {
  border: 1px solid var(--line2); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 8px; width: 220px;
}
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  border: 1px solid var(--line2); background: transparent; color: var(--ink);
  font-size: 12px; padding: 5px 11px; border-radius: 99px; cursor: pointer; transition: .12s;
}
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter-sep { align-self: stretch; width: 1px; min-height: 22px; margin: 0 4px; background: var(--line2); }
.spacer { flex: 1; }
.btn {
  border: 1px solid var(--line2); background: var(--surface); color: var(--ink);
  font-size: 12px; padding: 7px 13px; border-radius: 8px; cursor: pointer; transition: .12s;
}
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.sm { padding: 4px 10px; font-size: 11px; }

/* Projekt-Verweise oben rechts */
.own-board-link {
  flex-shrink: 0;
  background: var(--accent); color: #fff; text-decoration: none;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  padding: 7px 14px; border-radius: 99px; box-shadow: var(--shadow);
  transition: .12s;
}
.own-board-link:hover { background: color-mix(in srgb, var(--accent) 84%, #000); }
.own-board-link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Fork-Ribbon: gefaltete Eck-Ecke (reines CSS, CSP-sicher, kein externes Bild) */
.fork-ribbon {
  position: fixed; z-index: 1000; top: 36px; right: -52px;
  width: 200px; padding: 6px 0;
  background: var(--accent); color: #fff;
  text-align: center; text-decoration: none;
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  transform: rotate(45deg);
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
  /* die zwei eingenähten Linien erzeugen den „umgeblättertes Papier"-Effekt */
  border-top: 1px dashed rgba(255,255,255,.5);
  border-bottom: 1px dashed rgba(255,255,255,.5);
}
.fork-ribbon:hover { background: color-mix(in srgb, var(--accent) 84%, #000); }
.fork-ribbon:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 var(--pad-x) 28px; }
.col { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface2); display: flex; flex-direction: column; min-height: 120px; }
.col-h { padding: 10px 14px; font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.col-h .cnt { color: var(--muted); font-weight: 400; }
.list { padding: 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 50px; border-radius: var(--radius); }
.list.drag-over { background: color-mix(in srgb, var(--accent) 10%, transparent); outline: 2px dashed var(--accent); outline-offset: -4px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--muted);
  border-radius: 8px; padding: 10px 12px; cursor: grab; position: relative; box-shadow: var(--shadow);
}
.card:active { cursor: grabbing; }
.card.dragging { opacity: .4; }
.card .cid { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .3px; }
.card h3 { font-size: 13px; font-weight: 600; margin: 3px 0 4px; padding-right: 18px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 10px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line2); color: var(--muted); }
.tag.phase { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.card-todos, .dep-indicator { font-size: 10px; color: var(--muted); margin-top: 5px; }
.dep-indicator { color: var(--accent); }
.avatars { display: flex; gap: 3px; margin-top: 6px; }
.avatar { width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 700; display: grid; place-items: center; }
.del { position: absolute; top: 6px; right: 7px; border: 0; background: none; color: var(--muted); font-size: 15px; cursor: pointer; opacity: .4; }
.del:hover { opacity: 1; color: var(--danger); }
.add-btn { margin: 6px 10px 12px; border: 1px dashed var(--line2); background: transparent; color: var(--muted); font-size: 12px; padding: 8px; border-radius: 8px; cursor: pointer; }
.add-btn:hover { border-color: var(--ink); color: var(--ink); }

/* Dialog */
.dlg {
  border: 1px solid var(--line2); border-radius: 14px; background: var(--surface); color: var(--ink);
  padding: 0; width: min(640px, 94vw); max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  margin: auto; /* zentriert das modale Dialogfeld (überschreibt den *{margin:0}-Reset) */
}
.dlg::backdrop { background: rgba(0,0,0,.4); backdrop-filter: blur(2px); }
.dlg-head { padding: 18px 22px 16px; border-top: 4px solid var(--accent); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
.dlg-head .cid { font-size: 11px; font-weight: 700; letter-spacing: .4px; }
.dlg-head h2 { font-size: 17px; margin-top: 4px; }
.dlg-head-tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.pill { font-size: 10px; padding: 3px 10px; border-radius: 99px; color: #fff; font-weight: 600; white-space: nowrap; }
.pill.ghost { background: transparent; border: 1px solid var(--line2); color: var(--muted); }
.pill.done { background: var(--ok); } .pill.wip { background: var(--wip); } .pill.todo { background: var(--todo); }
.dlg-body { padding: 16px 22px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); }
.detail-body { font-size: 13px; line-height: 1.65; }
.detail-body h1,.detail-body h2,.detail-body h3 { margin: 12px 0 5px; font-size: 15px; }
.detail-body code { background: var(--line); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.detail-body a { color: var(--accent); }
.detail-body ul,.detail-body ol { padding-left: 20px; margin: 5px 0; }
.detail-body blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); margin: 8px 0; }
.detail-body table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 12px; }
.detail-body th,.detail-body td { border: 1px solid var(--line2); padding: 5px 8px; text-align: left; }
.detail-body th { background: var(--surface2); }
.md-check { color: var(--accent); }

/* Panels in detail */
.panel { margin-top: 14px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; }
.panel-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.panel-head .muted, .muted { color: var(--muted); font-weight: 400; }
.panel-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.panel-row .grow { flex: 1; min-width: 120px; }
.bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width .3s; }
.mini-num { width: 60px; }
.todo-list, .res-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.todo-list li, .res-list li { display: flex; align-items: center; gap: 8px; }
.todo-list label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
.todo-list .done { text-decoration: line-through; color: var(--muted); }
.icon-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
.icon-del:hover { color: var(--danger); }
.people-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.dep-card { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-top: 6px; cursor: pointer; }
.dep-card:hover { border-color: var(--accent); }
.dep-bar { width: 4px; height: 30px; border-radius: 2px; flex-shrink: 0; }
.dep-card .cid { font-size: 10px; font-weight: 700; color: var(--muted); }

/* Forms */
input, textarea, select { width: 100%; font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line2); border-radius: 7px; background: var(--bg); color: var(--ink); }
input[type="color"] { padding: 2px; height: 34px; }
input[type="checkbox"] { width: auto; }
textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; min-height: 140px; resize: vertical; }
.field { display: block; margin-top: 10px; }
.field > span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dep-picker { max-height: 160px; overflow-y: auto; border: 1px solid var(--line2); border-radius: 7px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.dep-picker label { display: flex; gap: 7px; align-items: center; font-size: 12px; }
.dep-picker input { width: auto; }

/* Settings */
.settings { padding: 8px var(--pad-x) 40px; display: flex; flex-direction: column; gap: 18px; max-width: 880px; }
.settings-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.settings-block h2 { font-size: 15px; margin-bottom: 10px; }
.settings-block .rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.edit-row { display: flex; gap: 8px; align-items: center; }
.edit-row input { flex: 1; }
.edit-row input[type="color"] { flex: 0 0 44px; }
.edit-row .read-cell { flex: 1; font-size: 13px; color: var(--muted); align-self: center; padding: 0 2px; }
.edit-row.heads { padding: 0 2px 2px; }
.edit-row.heads span { font-size: 11px; color: var(--muted); font-weight: 600; }
.head-spacer { flex: 0 0 24px; }

/* Gantt */
/* Horizontaler Seitenabstand als margin (nicht padding): so klebt die sticky
   Label-Spalte bündig am linken Scroll-Rand und „driftet" nicht erst um --pad-x. */
.gantt-wrap { padding: 12px 0 30px; margin: 0 var(--pad-x); overflow-x: auto; overscroll-behavior-x: contain; }
.gantt-foot { padding: 0 var(--pad-x) 5px; }
.gantt-blockers { margin: 18px 0 0; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; box-sizing: border-box; }
.gantt-blockers .panel-head { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.blocker-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.blocker-chip { display: inline-flex; align-items: center; gap: 2px; font-size: 11px; background: var(--surface); border: 1px solid var(--line2); border-radius: 99px; padding: 3px 4px 3px 11px; }
.gantt-blockers .panel-row { flex-wrap: wrap; }
.gantt-blockers input[type="date"] { flex: 0 1 150px; }
.gantt-blockers input[type="text"] { flex: 1 1 180px; }
.field-cap { font-size: 11px; color: var(--muted); align-self: center; }
.gantt-rows { position: relative; }
.gantt-connectors { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 4; }
.gantt-planned-end { position: absolute; top: 0; width: 0; border-left: 2px dashed var(--danger); opacity: .5; pointer-events: none; z-index: 3; }
.gantt-today-line { position: absolute; top: 0; width: 0; border-left: 2px solid var(--accent); opacity: .6; pointer-events: none; z-index: 3; }
.gantt { min-width: 960px; }
.gantt-axis { display: flex; border-bottom: 2px solid var(--line); padding-bottom: 5px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
.gantt-label-col { width: 270px; min-width: 270px; font-size: 12px; font-weight: 700; color: var(--muted); position: sticky; left: 0; z-index: 6; background: var(--bg); }
.gantt-timeline { flex: 1; display: flex; }
.gantt-week { text-align: center; font-size: 10px; color: var(--muted); border-left: 1px solid var(--line); padding: 3px 0; }
.gantt-group { margin: 14px 0 3px; font-size: 13px; font-weight: 700; border-radius: 6px; background: var(--surface2); display: flex; }
/* Farbiger Rand + Text als sticky Einheit, damit beim Scrollen der linke Rand fix bleibt. */
.gantt-group-label { position: sticky; left: 0; z-index: 5; padding: 6px 10px; border-left: 4px solid; border-radius: 6px 0 0 6px; background: var(--surface2); }
.gantt-row { display: flex; align-items: center; height: 38px; border-bottom: 1px solid var(--line); }
.gantt-row:hover { background: var(--surface2); }
.gantt-row:hover .gantt-row-label { background: var(--surface2); }
/* align-self: stretch -> Label-Box füllt die volle Zeilenhöhe, damit der opake
   Hintergrund beim Scrollen den ganzen (24px hohen) Balken verdeckt und nichts oben/unten herausschaut. */
.gantt-row-label { width: 270px; min-width: 270px; font-size: 12px; padding-right: 10px; cursor: pointer; position: sticky; left: 0; z-index: 5; background: var(--bg); align-self: stretch; display: flex; align-items: center; }
.gantt-row-label .rl-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gantt-row-label:hover { color: var(--accent); }
.gantt-row-label.done { text-decoration: line-through; color: var(--muted); }
.gantt-row-label .rid { color: var(--muted); font-weight: 700; margin-right: 4px; }
.gantt-bar-area { flex: 1; position: relative; height: 100%; }
.gantt-bar { position: absolute; height: 24px; top: 7px; border-radius: 6px; min-width: 6px; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
.gantt-bar.overflow { outline: 1.5px solid color-mix(in srgb, var(--danger) 55%, transparent); }
.gantt-bar .bar-label { font-size: 10px; color: #fff; padding: 0 7px; line-height: 24px; white-space: nowrap; overflow: hidden; font-weight: 600; }
/* Label rechts neben den Balken, wenn es darin nicht lesbar wäre (zu schmal). */
.gantt-bar .bar-label--outside { position: absolute; left: 100%; top: 0; margin-left: 5px; padding: 0; color: var(--ink); overflow: visible; }
/* "In Bearbeitung": pulsierender Akzent-Ring, komponierbar mit Overflow-Füllung. */
.gantt-bar.wip { animation: lk-wip 3s ease-in-out infinite; }
@keyframes lk-wip {
  0%, 100% { box-shadow: var(--shadow), 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
  50%      { box-shadow: var(--shadow), 0 0 0 5px color-mix(in srgb, var(--accent) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) {
  .gantt-bar.wip { animation: none; box-shadow: var(--shadow), 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
}
.blocked-layer { position: absolute; inset: 0; pointer-events: none; }
.blocked-band { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(220,38,38,.12), rgba(220,38,38,.12) 5px, transparent 5px, transparent 10px); border-left: 1px solid rgba(220,38,38,.35); border-right: 1px solid rgba(220,38,38,.35); }
.dep-badge { font-size: 9px; color: #fff; padding: 1px 5px; border-radius: 3px; font-weight: 700; margin-left: 5px; }
.gantt-legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 14px; font-size: 11px; color: var(--muted); }
.gantt-legend .li { display: inline-flex; align-items: center; gap: 6px; }
.gantt-legend .sw { width: 24px; height: 13px; border-radius: 4px; flex: 0 0 auto; background: var(--accent); }
.gantt-legend .sw.done { opacity: .35; }
.gantt-legend .sw.over { background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 7px, color-mix(in srgb, var(--danger) 60%, var(--accent)) 7px, color-mix(in srgb, var(--danger) 60%, var(--accent)) 10px); }
.gantt-legend .sw.wip { animation: lk-wip 3s ease-in-out infinite; }
.gantt-legend .sw.today { width: 0; height: 17px; border-radius: 0; background: none; border-left: 2px solid var(--accent); opacity: .6; }
.gantt-legend .sw.end { width: 0; height: 17px; border-radius: 0; background: none; border-left: 2px dashed var(--danger); opacity: .6; }
.gantt-legend .sw.dep { width: 0; height: 0; background: none; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .gantt-legend .sw.wip { animation: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
}
.warn { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; }

/* Fortschritt & Budget (Kanban-Kopf) */
.progress-area { padding: 4px var(--pad-x) 12px; display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; }
.prog-bar-wrap { flex: 1; min-width: 240px; }
.prog-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.prog-bar { height: 14px; border-radius: 7px; background: var(--line); display: flex; overflow: hidden; }
.prog-seg { height: 100%; transition: width .3s; }
.prog-blocks { display: flex; flex-wrap: wrap; gap: 6px; }
.prog-block { font-size: 11px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--line2); }
.budget { width: 100%; display: flex; flex-wrap: wrap; gap: 16px; font-size: 11px; color: var(--muted); }
.budget .over { color: var(--danger); font-weight: 600; }

/* Export-Dropdown */
.menu { position: relative; display: inline-block; }
.menu > summary { list-style: none; cursor: pointer; user-select: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 180px; z-index: 50; display: flex; flex-direction: column; gap: 2px; }
.menu-item { text-align: left; border: 0; background: none; color: var(--ink); font: inherit; font-size: 12px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu-item:hover { background: var(--surface2); }

/* Toast */
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 12px; padding: 9px 16px; border-radius: 8px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }

/* Lerntage-Editor (Einstellungen) */
.setting-hint { margin: 2px 0 6px; }
.daypattern { display: flex; flex-direction: column; gap: 6px; }
.day-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.day-cell { display: flex; align-items: center; gap: 5px; padding: 5px 8px; border: 1px solid var(--line2); border-radius: 8px; background: var(--bg); font-size: 12px; }
.day-cell.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.day-cell input[type="checkbox"] { width: auto; flex: 0 0 auto; margin: 0; }
.day-cell span { color: var(--muted); }
.day-cell.on span { color: var(--ink); font-weight: 600; }
.day-cell .day-hours { width: 52px; flex: 0 0 52px; padding: 3px 5px; }
.day-sum { font-size: 11px; }
.phase-item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface2); }
.phase-adv { margin-top: 8px; }
.phase-adv summary { font-size: 12px; color: var(--accent); cursor: pointer; }
.phase-adv .daypattern { margin-top: 6px; }

/* Spalten-Umschalter im Detail (Touch-Ersatz fürs Drag&Drop) */
.col-switch { display: flex; flex-wrap: wrap; gap: 6px; }
.col-switch-btn {
  flex: 1 1 auto; min-width: 90px;
  border: 1px solid var(--line2); background: var(--surface); color: var(--ink);
  font: inherit; font-size: 12px; font-weight: 600; padding: 8px 12px;
  border-radius: 8px; cursor: pointer; transition: .12s;
}
.col-switch-btn:hover { border-color: var(--ink); }
.col-switch-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); cursor: default; }

/* Segmented-Toggle Gantt <-> Liste (Zeitplan-Tab) */
.seg-toggle { display: inline-flex; gap: 0; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.seg-btn { border: 0; background: var(--surface); color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; padding: 7px 16px; cursor: pointer; }
.seg-btn + .seg-btn { border-left: 1px solid var(--line2); }
.seg-btn.on { background: var(--accent); color: #fff; }

/* Zeitplan-Listenansicht */
.sched-list-wrap { padding: 0 var(--pad-x) 30px; }
/* Eine Grid-Tabelle für alle Gruppen; Zeilen docken per subgrid an diese Spalten
   an -> Zeitraum/Phase/Nutzer/Stunden/Status fluchten über alle Zeilen hinweg. */
.sched-table {
  display: grid;
  grid-template-columns: minmax(0, 1fr) max-content max-content max-content max-content max-content;
  column-gap: 14px; row-gap: 6px; align-items: center;
}
.sched-table .gantt-group { grid-column: 1 / -1; }
.sched-row {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
  align-items: center; padding: 8px 12px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--muted);
  border-radius: 8px; cursor: pointer; transition: .12s;
}
.sched-row:hover { border-color: var(--accent); }
.sched-cell.title { font-size: 13px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sched-cell.title .rid { color: var(--muted); font-weight: 700; margin-right: 4px; }
.sched-row.done .sched-cell.title { text-decoration: line-through; color: var(--muted); }
.sched-cell.range { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.sched-cell.range.over { color: var(--danger); }
.sched-cell.hours { font-size: 11px; color: var(--muted); white-space: nowrap; }
.sched-cell.people .avatars { margin: 0; }
.sched-cell.status .pill { white-space: nowrap; }

/* --- Tablet: Board einspaltig (bestehender Breakpoint) --- */
@media (max-width: 900px) {
  .board { grid-template-columns: 1fr; }
}

/* --- Smartphone --- */
@media (max-width: 640px) {
  :root { --pad-x: 12px; }
  .app-header { flex-wrap: wrap; } /* Aside (Timer/Link) bricht unter den Titel um */
  .app-header h1 { font-size: 18px; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tab { white-space: nowrap; }
  .search { width: 100%; }
  .chips { width: 100%; }
  .filter-sep { display: none; }
  /* Kein Spacer mehr -> die umgebrochenen Aktions-Buttons (Gantt/Liste, Demo,
     Import, Export) stehen linksbündig statt rechts gedrängt. */
  .spacer { display: none; }

  /* Dialog vollflächig */
  .dlg { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
  .grid2 { grid-template-columns: 1fr; }

  /* Eck-Verweise */
  .fork-ribbon { display: none; }
  .own-board-link { padding: 6px 11px; font-size: 11px; }

  /* Liste: Zusatzspalten ausblenden -> nur Titel, Stunden, Status */
  .sched-table { grid-template-columns: minmax(0, 1fr) max-content max-content; column-gap: 8px; }
  .sched-cell.range, .sched-cell.phase, .sched-cell.people { display: none; }
}

/* --- Touch-Geräte: größere Tap-Targets --- */
@media (pointer: coarse) {
  .btn, .chip, .menu-item, .seg-btn, .col-switch-btn { min-height: 40px; }
  .tab { min-height: 44px; }
  .del, .icon-del { font-size: 20px; min-width: 36px; min-height: 36px; opacity: .7; }
  input[type="checkbox"] { width: 20px; height: 20px; }
}

<script>"use strict";
(function(){
const __M_naming = (function(){
// WBS-Benennung (Work Breakdown Structure, DIN 69901 / PMI).
// Berechnet hierarchische Codes (1, 1.1, 1.2, 2 ...) je Kategorie aus
// optionaler Eltern-Hierarchie (parentId) und der Sortierung (order).
// Reine Logik, kein DOM — wird von App, Generator und Tests genutzt.

/**
 * Sortiert Geschwister-Aufgaben stabil nach `order`, dann Titel.
 */
function sortSiblings(tasks) {
  return [...tasks].sort((a, b) => {
    const oa = Number.isFinite(a.order) ? a.order : 0;
    const ob = Number.isFinite(b.order) ? b.order : 0;
    if (oa !== ob) return oa - ob;
    return String(a.title || "").localeCompare(String(b.title || ""), "de");
  });
}

/**
 * Weist jeder Aufgabe in board.tasks einen `wbs`-String zu (mutiert die Tasks).
 * Top-Ebene je Kategorie: 1,2,3 …; Kinder: 1.1,1.2 …
 * Kategorie-Reihenfolge folgt config.categories; unbekannte Kategorien hinten.
 * Gibt board zurück.
 */
function computeWbs(board) {
  const tasks = board.tasks || [];
  const catOrder = new Map((board.config?.categories || []).map((c, i) => [c.id, i]));
  const byId = new Map(tasks.map((t) => [t.id, t]));

  // Kinder je Elternknoten sammeln (Wurzel = parentId fehlt/unbekannt).
  const childrenOf = new Map(); // parentId|null -> [tasks]
  for (const t of tasks) {
    const parent = t.parentId && byId.has(t.parentId) ? t.parentId : null;
    if (!childrenOf.has(parent)) childrenOf.set(parent, []);
    childrenOf.get(parent).push(t);
  }

  // Wurzeln je Kategorie gruppieren und in Kategorie-Reihenfolge nummerieren.
  const roots = childrenOf.get(null) || [];
  const rootsByCat = new Map();
  for (const t of roots) {
    const cat = t.categoryId || "";
    if (!rootsByCat.has(cat)) rootsByCat.set(cat, []);
    rootsByCat.get(cat).push(t);
  }

  const assign = (task, code) => {
    task.wbs = code;
    const kids = sortSiblings(childrenOf.get(task.id) || []);
    kids.forEach((kid, i) => assign(kid, `${code}.${i + 1}`));
  };

  const sortedCats = [...rootsByCat.keys()].sort((a, b) => {
    const ia = catOrder.has(a) ? catOrder.get(a) : Infinity;
    const ib = catOrder.has(b) ? catOrder.get(b) : Infinity;
    if (ia !== ib) return ia - ib;

function phaseBudgetHours(phase, board) {

  if (!s || !e || e.getTime() < s.getTime()) return 0;

  // Gesperrte Tage als Set absoluter Datums-Millis (Mitternacht).

  for (const b of board?.blockers || []) {

    const be = parseDate(b.end) || bs;
    if (!bs) continue;
    for (let t = bs.getTime(); t <= be.getTime(); t += MS_PER_DAY) blocked.add(t);

    if (!bs) continue;
    const from = Math.max(s.getTime(), bs.getTime());
    const to = Math.min(e.getTime(), be.getTime());

 * @param {object} board v2-Board

  }
  const isBlocked = (day) => blockedSet.has(day);

  /** Platziert eine Dauer ab earliest, überspringt gesperrte Tage. */

    while (isBlocked(day)) day += 1;
    const start = day;

   * Tageskapazität des Patterns. Teilt einen Tag stundengenau (used = Reststunden).
   * Liefert echte Kalender-Offsets { startDay, endDay, used }.
   */

    const usedHere = (d) => (d === cursor.day ? cursor.used : 0);

    if (hours <= EPS) {
      let d = startSearch, n = 0;
      while (n <= WALK_GUARD && capAt(d, pm) - usedHere(d) <= EPS) { d += 1; n += 1; }
      return { startDay: d, endDay: d, used: usedHere(d) };
    }

    let remaining = hours, day = startSearch;
    let startDay = null, endDay = null, lastUsed = 0, n = 0;
    while (remaining > EPS && n <= WALK_GUARD) {

    }

      const dep = byId.get(depId);

      const ds = scheduleTask(dep);
      if (ds.endDay + 1 > earliest) earliest = ds.endDay + 1;
    }

    const hours = effectiveHours(task, isDone);
    const overflow = (task.estH || 0) > 0 && task.loggedM / 60 > task.estH;

    const ck = `${task.categoryId}|${task.phaseId}`;
    const cursor = catCursor.get(ck); // { day, used } oder undefined

    let startDay, endDay, dur;
    if (pattern) {
      const pm = patternMap(pattern);
      const start = cursor && cursor.day >= earliest ? cursor : { day: earliest, used: 0 };
      const r = placeHours(start, hours, pm);
      startDay = r.startDay; endDay = r.endDay;
      catCursor.set(ck, { day: endDay, used: r.used });
      dur = endDay - startDay + 1;
    } else {
      let e2 = earliest;
      if (cursor && cursor.day > e2) e2 = cursor.day;
      dur = daysForHours(hours, hpw);
      const placed = place(e2, dur);
      startDay = placed.startDay; endDay = placed.endDay;
      catCursor.set(ck, { day: endDay + 1, used: 0 });
    }

    visiting.delete(task.id);
    result[task.id] = { startDay, endDay, dur, overflow };
    return result[task.id];
  }

  // Stabile Reihenfolge: nach Phase, dann WBS/Order.
  const phaseOrder = new Map((cfg.phases || []).map((p, i) => [p.id, i]));
  const sorted = [...tasks].sort((a, b) => {
    const pa = phaseOrder.has(a.phaseId) ? phaseOrder.get(a.phaseId) : 99;
    const pb = phaseOrder.has(b.phaseId) ? phaseOrder.get(b.phaseId) : 99;
    if (pa !== pb) return pa - pb;
    return String(a.wbs || a.order).localeCompare(String(b.wbs || b.order), "de", { numeric: true });
  });
  sorted.forEach(scheduleTask);

  // Achse bis zum tatsächlichen Ende aller Aufgaben verlängern: Balken, die über
  // das geplante Ende hinauslaufen (Overflow/Abhängigkeiten), sollen den Zeitraum
  // erweitern statt an den rechten Rand gequetscht zu werden. +1, weil die Balken-
  // breite über dayToX(endDay + 1) (Tag nach Ende) berechnet wird.
  for (const id in result) if (result[id].endDay + 1 > totalDays) totalDays = result[id].endDay + 1;

  return {
    tasks: result,
    t0: t0.toISOString().slice(0, 10),
    totalDays,
    plannedDays,
    blocked: [...blockedSet].sort((a, b) => a - b),
    hasCycle,
  };
}

/**
 * Sortierte Tages-Offsets [0..totalDays], die in irgendeiner Phase ein Lerntag
 * sind (Kapazität > 0, nicht gesperrt). Für die komprimierte Datums-Achse.
 * Phasen ohne Pattern (Legacy) zählen jeden nicht gesperrten Tag im Bereich.
 * Liefert null, wenn nirgends ein Lerntage-Pattern definiert ist (lineare Achse).
 */
function learningDayOffsets(board, sched) {
  const cfg = board.config || {};

    || (cfg.phases || []).some((p) => (p.availableDays?.length || 0) > 0);
  if (!hasAnyPattern) return null;

  const t0 = parseDate(sched.t0);
  if (!t0) return null;
  const total = Math.max(1, sched.totalDays);
  const blocked = new Set(sched.blocked || []);
  const dateToDays = (d) => Math.round((d.getTime() - t0.getTime()) / MS_PER_DAY);

  const phases = (cfg.phases || []).map((p) => {
    const s = parseDate(p.start);
    const e = parseDate(p.end);
    const pattern = resolvePattern(p, cfg);
    return {
      from: s ? dateToDays(s) : 0,
      to: e ? dateToDays(e) : total,
      pm: pattern ? patternMap(pattern) : null,
    };
  });

  const maxTo = phases.length ? Math.max(...phases.map((p) => p.to)) : total;
  // Spätester tatsächlich belegter Tag: nur bis hierhin wird der Rhythmus über das
  // Phasenende hinaus fortgeführt (Overflow), nicht bis zu einem späten endDate.
  let maxTaskEnd = 0;
  for (const id in sched.tasks || {}) maxTaskEnd = Math.max(maxTaskEnd, sched.tasks[id].endDay || 0);

  const days = [];
  for (let d = 0; d <= total; d += 1) {
    if (blocked.has(d)) continue;
    const dow = isoDow(new Date(t0.getTime() + d * MS_PER_DAY));
    let learning = false;
    for (const ph of phases) {
      if (d < ph.from || d > ph.to) continue;
      if (ph.pm === null) { learning = true; break; }     // Legacy: jeder Tag
      if ((ph.pm.get(dow) || 0) > 0) { learning = true; break; }
    }
    // Hinter dem letzten Phasenende, aber innerhalb einer verlängerten Aufgabe
    // (Overflow): Rhythmus der Phasen fortführen -> echte Slots statt Quetschen.
    if (!learning && d > maxTo && d <= maxTaskEnd) {
      for (const ph of phases) {
        if (ph.pm === null) { learning = true; break; }
        if ((ph.pm.get(dow) || 0) > 0) { learning = true; break; }
      }
    }

      try { embedded = normalizeBoard(safeParse(el.textContent)); } catch (e) { /* Default */ }

  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "dataset") for (const [dk, dv] of Object.entries(v)) node.dataset[dk] = dv;

const __M_render_progress = (function(){

function round1(n) { return Math.round(n * 10) / 10; }

function progressArea(board) {
  const cols = board.config.columns;
  const firstCol = cols[0].id, lastCol = cols[cols.length - 1].id;
  let todo = 0, wip = 0, done = 0;

    const pc = (perCat[t.categoryId] = perCat[t.categoryId] || { total: 0, done: 0 });
    pc.total++; if (isDone) pc.done++;
  }
  const total = board.tasks.length || 1;
  const pct = (n) => Math.round(n / total * 100);

  // Budget je Phase (Summe estH vs. dynamisches Budget aus Std./Woche)
  const phaseHours = {};
  for (const t of board.tasks) phaseHours[t.phaseId] = (phaseHours[t.phaseId] || 0) + (t.estH || 0);
  const loggedH = Math.floor(board.tasks.reduce((a, t) => a + (t.loggedM || 0), 0) / 60);

    h("div", { class: "prog-blocks" },
      board.config.categories.map((c) => {
        const v = perCat[c.id] || { total: 0, done: 0 };
        const p = v.total ? Math.round(v.done / v.total * 100) : 0;
        return h("span", { class: "prog-block", style: { borderColor: c.color } }, `${c.prefix || c.label}: ${p}%`);
      })),
    h("div", { class: "budget" },
      board.config.phases.map((ph) => {

        const over = budget > 0 && used > budget;
        return h("span", {},

          over ? h("span", { class: "over" }, " ⚠ über Budget!") : null);
      }),
      h("span", {}, `⏱ Gesamt geloggt: ${loggedH}h`)));

  const compressed = dateMode && learnDays && learnDays.length > 0;
  const nLearn = compressed ? learnDays.length : 0;
  const coordOf = (d) => { // Anzahl Lerntage strikt vor Offset d (Bin-Suche)
    let lo = 0, hi = learnDays.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (learnDays[mid] < d) lo = mid + 1; else hi = mid; }
    return lo;
  };
  // Zeitachse nutzt nur PLOT% der Breite -> rechts bleibt ein Puffer, damit Balken
  // (und ihre Labels) am rechten Rand nicht abgeschnitten werden.
  const PLOT = 95;
  const dayToX = compressed
    ? (d) => Math.min(PLOT, Math.max(0, (coordOf(d) / nLearn) * PLOT))
    : (d) => Math.min(PLOT, Math.max(0, (d / total) * PLOT));

  // Fortschritts-/Budget-Kopf (außerhalb der scrollbaren Gantt-Tabelle, damit
  // er bündig wie in den anderen Ansichten am Seitenrand sitzt).
  clear(mountEl).appendChild(progressArea(board));

  const wrap = h("div", { class: "gantt-wrap" });
  const cols = board.config.columns;
  const doneId = cols[cols.length - 1].id;

  if (sched.hasCycle) {
    wrap.appendChild(h("div", { class: "warn" }, "⚠ Zyklische Abhängigkeit erkannt — Reihenfolge ggf. unvollständig."));
  }

  const chart = h("div", { class: "gantt" });

  // Achse
  const axis = h("div", { class: "gantt-axis" }, h("div", { class: "gantt-label-col" }, "Aufgabe"));
  const timeline = h("div", { class: "gantt-timeline" });
  if (compressed) {
    // Ein Tick je Lerntag, sinnvoll ausgedünnt (max. ~14 Beschriftungen).
    const step = Math.max(1, Math.ceil(nLearn / 14));
    for (let k = 0; k < nLearn; k += step) {
      const dt = new Date(t0.getTime() + learnDays[k] * MS_PER_DAY);
      const span = Math.min(step, nLearn - k);
      timeline.appendChild(h("div", { class: "gantt-week", style: { flex: `0 0 ${(span / nLearn * PLOT).toFixed(2)}%` } }, dmLabel(dt)));
    }
  } else {
    for (let d = 0; d < total; d += 7) {
      const dt = new Date(t0.getTime() + d * MS_PER_DAY);
      const label = dateMode ? dmLabel(dt) : "KW" + isoWeek(dt);
      timeline.appendChild(h("div", { class: "gantt-week", style: { flex: `0 0 ${(7 / total * PLOT).toFixed(2)}%` } }, label));
    }
  }
  axis.appendChild(timeline);
  chart.appendChild(axis);

  // In der komprimierten Lerntage-Ansicht entfallen gesperrte Tage komplett.
  const blockedRanges = compressed ? [] : contiguousRanges(sched.blocked);
  const blockedBands = () => h("div", { class: "blocked-layer" },
    blockedRanges.map(([s, e]) => h("div", {
      class: "blocked-band", title: "Gesperrt",
      style: { left: dayToX(s) + "%", width: Math.max(0.6, dayToX(e + 1) - dayToX(s)) + "%" },
    })));

  // Zeilen sammeln; Balken-Elemente je Task-ID merken (für Connector-Messung).
  const rows = h("div", { class: "gantt-rows" });
  const barEls = {};

  for (const c of board.config.categories) {
    const items = board.tasks
      .filter((t) => t.categoryId === c.id)
      .sort((a, b) => String(a.wbs).localeCompare(String(b.wbs), "de", { numeric: true }));
    if (!items.length) continue;

    rows.appendChild(h("div", { class: "gantt-group", style: { color: c.color, borderColor: c.color } },
      h("span", { class: "gantt-group-label" }, c.label || c.prefix)));

    for (const t of items) {
      const s = sched.tasks[t.id];
      if (!s) continue;
      const left = dayToX(s.startDay);
      const width = Math.max(0.8, dayToX(s.endDay + 1) - dayToX(s.startDay));
      const isDone = t.columnId === doneId;
      const isWip = !isDone && t.columnId !== cols[0].id; // weder erste (To-do) noch letzte (Erledigt) Spalte

      // Innenabstand an den Tages-/KW-Grenzen, damit aufeinanderfolgende Balken sich
      // nicht berühren und die Verbindungslinien Platz haben. Gedeckelt auf 25% der
      // Balkenbreite, damit schmale Balken (kurze Aufgaben in der KW-Ansicht) nicht
      // verschwinden – sie behalten mindestens die Hälfte ihrer Breite.
      const inset = `min(10px, ${(width * 0.25).toFixed(2)}%)`;
      const barStyle = { left: `calc(${left.toFixed(2)}% + ${inset})`, width: `calc(${width.toFixed(2)}% - 2 * ${inset})`, background: c.color };
      if (isDone) barStyle.opacity = "0.35";
      if (s.overflow) barStyle.background = `repeating-linear-gradient(45deg, ${c.color}, ${c.color} 11px, color-mix(in srgb, var(--danger) 60%, ${c.color}) 11px, color-mix(in srgb, var(--danger) 60%, ${c.color}) 15px)`;

      const bar = h("div", {
        class: "gantt-bar" + (s.overflow ? " overflow" : "") + (isWip ? " wip" : ""),
        style: barStyle, onclick: () => openDetail(t.id),
      }, h("span", { class: "bar-label" }, `${t.estH || 0}h`));
      barEls[t.id] = bar;

      rows.appendChild(h("div", { class: "gantt-row" },
        h("div", { class: "gantt-row-label" + (isDone ? " done" : ""), onclick: () => openDetail(t.id), title: t.title },
          h("span", { class: "rl-text" }, h("span", { class: "rid" }, formatLabel(t, board)), " ", t.title)),
        h("div", { class: "gantt-bar-area" }, blockedBands(), bar)));
    }
  }
  chart.appendChild(rows);

  // Heute-Position für die vertikale Heute-Linie (wird unten als Overlay gezeichnet).
  const today = new Date();
  const todayDay = Math.round((Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate()) - t0.getTime()) / MS_PER_DAY);
  const todayFrac = (todayDay >= 0 && todayDay <= total) ? dayToX(todayDay) / 100 : null;

  wrap.appendChild(chart);
  mountEl.appendChild(wrap);

  // Legende + Blocker-Panel sitzen außerhalb des Horizontal-Scrolls (Footer in
  // Seitenbreite), damit sie beim Scrollen stehen bleiben und nicht beschnitten werden.
  // Legende erklärt Balken-Zustände und die „geplantes Ende"-Linie.
  mountEl.appendChild(h("div", { class: "gantt-foot" },
    ganttLegend(),
    blockerPanel(board)));

  // „Geplantes Ende"-Marker, wenn Aufgaben über das konfigurierte Ende hinauslaufen.
  const plannedFrac = (sched.plannedDays != null && sched.plannedDays < total)
    ? dayToX(sched.plannedDays) / 100

  // Label-Platzierung, Pfeile und Marker hängen von der gemessenen Geometrie ab und
  // werden bei jeder Breitenänderung (Resize, Scrollbar-Reflow) neu berechnet
  // -> bleiben an jeder Bildschirmbreite korrekt.
  setupGanttOverlays(rows, barEls, board, plannedFrac, todayFrac);

// Balken-Labels, die breiter als ihr Balken sind, werden rechts daneben gesetzt
// (statt im Balken abgeschnitten zu werden). Muss nach dem Layout laufen.
function adjustBarLabels(container) {
  for (const bar of container.querySelectorAll(".gantt-bar")) {
    const label = bar.querySelector(".bar-label");
    if (!label) continue;
    label.classList.remove("bar-label--outside");
    if (label.scrollWidth > bar.clientWidth + 1) label.classList.add("bar-label--outside");
  }
}

// Hält Label-Platzierung und Connector-Messung an der tatsächlichen Balken-Geometrie
// aktuell. Die Balken sind prozentual skaliert, das SVG arbeitet aber mit Pixel-
// Koordinaten – ohne Neuvermessung verrutschen die Pfeile bei Breitenänderung.
let _ganttRO = null;
let _ganttScroll = null; // { el, fn } – Scroll-Listener zum Ausblenden der Marker
function setupGanttOverlays(container, barEls, board, plannedFrac, todayFrac) {
  if (_ganttRO) { _ganttRO.disconnect(); _ganttRO = null; }
  if (_ganttScroll) { _ganttScroll.el.removeEventListener("scroll", _ganttScroll.fn); _ganttScroll = null; }
  const refresh = () => {
    adjustBarLabels(container);
    container.querySelector("svg.gantt-connectors")?.remove();
    container.querySelector(".gantt-planned-end")?.remove();
    container.querySelector(".gantt-today-line")?.remove();
    drawDepConnectors(container, barEls, board);
    if (todayFrac != null) drawTodayLine(container, todayFrac);
    if (plannedFrac != null) drawPlannedEnd(container, plannedFrac);
    clipMarkersToTimeline(container);
  };
  refresh(); // sofort, damit Pfeile/Labels nicht erst nach einem Frame erscheinen
  if (typeof ResizeObserver === "function") {
    let raf = 0;
    _ganttRO = new ResizeObserver(() => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(refresh); // Messung erst nach abgeschlossenem Layout
    });
    _ganttRO.observe(container);
  }
  // Beim Horizontal-Scrollen die vertikalen Marker ausblenden, sobald sie hinter die
  // fixe Label-Spalte rutschen (sonst schauen sie an deren rechtem Rand hervor).
  const wrap = container.closest(".gantt-wrap");
  if (wrap) {
    let raf2 = 0;
    const fn = () => { cancelAnimationFrame(raf2); raf2 = requestAnimationFrame(() => clipMarkersToTimeline(container)); };
    wrap.addEventListener("scroll", fn, { passive: true });
    _ganttScroll = { el: wrap, fn };
  }
}

// Heute-/Ende-Linie verstecken, wenn ihre X-Position unter der fixen Label-Spalte liegt.
function clipMarkersToTimeline(container) {
  const labelEl = container.querySelector(".gantt-row-label");
  if (!labelEl) return;
  const labelRight = labelEl.getBoundingClientRect().right;
  for (const line of container.querySelectorAll(".gantt-today-line, .gantt-planned-end")) {
    line.style.visibility = line.getBoundingClientRect().left < labelRight - 0.5 ? "hidden" : "visible";
  }
}

// Vertikale „Heute"-Linie an der gemessenen X-Position (frac der Balkenfläche).
function drawTodayLine(container, frac) {
  const area = container.querySelector(".gantt-bar-area");
  if (!area) return;
  const base = container.getBoundingClientRect();
  const ar = area.getBoundingClientRect();
  if (!ar.width) return;
  const x = (ar.left - base.left) + frac * ar.width;
  container.appendChild(h("div", {
    class: "gantt-today-line", title: "Heute",
    style: { left: x.toFixed(1) + "px", height: container.scrollHeight + "px" },
  }));
}

// Vertikale „geplantes Ende"-Linie an der gemessenen X-Position (frac der Balkenfläche).
function drawPlannedEnd(container, frac) {
  const area = container.querySelector(".gantt-bar-area");
  if (!area) return;
  const base = container.getBoundingClientRect();
  const ar = area.getBoundingClientRect();
  if (!ar.width) return;
  const x = (ar.left - base.left) + frac * ar.width;
  container.appendChild(h("div", {
    class: "gantt-planned-end", title: "Geplantes Ende",
    style: { left: x.toFixed(1) + "px", height: container.scrollHeight + "px" },
  }));
}

function drawDepConnectors(container, barEls, board) {
  const base = container.getBoundingClientRect();
  if (!base.width) return;

  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("class", "gantt-connectors");
  svg.setAttribute("width", base.width);
  svg.setAttribute("height", base.height);

  const defs = document.createElementNS(SVGNS, "defs");
  const marker = document.createElementNS(SVGNS, "marker");
  marker.setAttribute("id", "lk-arrow");
  marker.setAttribute("viewBox", "0 0 10 10");
  marker.setAttribute("refX", "9"); marker.setAttribute("refY", "5");
  marker.setAttribute("markerWidth", "6"); marker.setAttribute("markerHeight", "6");
  marker.setAttribute("orient", "auto-start-reverse");
  const tip = document.createElementNS(SVGNS, "path");
  tip.setAttribute("d", "M0 0 L10 5 L0 10 z");
  tip.setAttribute("fill", "context-stroke");
  marker.appendChild(tip); defs.appendChild(marker); svg.appendChild(defs);

  const catColor = (cid) => board.config.categories.find((c) => c.id === cid)?.color || "#888";

  for (const t of board.tasks) {
    const toBar = barEls[t.id];
    if (!toBar || !t.deps || !t.deps.length) continue;
    const tr = toBar.getBoundingClientRect();
    const x2 = tr.left - base.left;
    const y2 = tr.top - base.top + tr.height / 2;

    for (const depId of t.deps) {
      const fromBar = barEls[depId];
      if (!fromBar) continue;
      const fr = fromBar.getBoundingClientRect();
      const x1 = fr.right - base.left;
      const y1 = fr.top - base.top + fr.height / 2;
      // Orthogonal: runter, dann nach rechts ins Ziel. Die senkrechte Spur xv bleibt
      // rechts der Quelle (kein Überlaufen des Quellbalkens). Eintritts-Stummel hat
      // Vorrang (Platz für den Pfeil): bis zu 12px vor dem Ziel; ist die Lücke kleiner,
      // wird sie voll genutzt. Bei großer Lücke bleibt ein kleiner Austritts-Stummel.
      const xv = Math.max(x1, Math.min(x1 + 4, x2 - 12));
      const path = document.createElementNS(SVGNS, "path");
      path.setAttribute("d", `M ${x1} ${y1} H ${xv} V ${y2} H ${x2}`);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", catColor(t.categoryId));
      path.setAttribute("stroke-width", "1.6");
      path.setAttribute("opacity", "0.75");
      path.setAttribute("marker-end", "url(#lk-arrow)");
      svg.appendChild(path);
    }
  }
  container.appendChild(svg);
}

  return { renderGantt };
})();

    });
    cb.addEventListener("change", () => {
      if (cb.checked) map.set(w.dow, map.get(w.dow) || 1);
      else map.delete(w.dow);
      emit();
    });
    hrs.addEventListener("change", () => {
      map.set(w.dow, Math.max(0, parseFloat(hrs.value) || 0));
      emit();
    });
    return h("label", { class: "day-cell" + (active ? " on" : "") }, cb, h("span", {}, w.label), hrs);
  });

  return h("div", { class: "daypattern" },
    h("div", { class: "day-grid" }, cells),
    h("div", { class: "muted day-sum" }, `Summe: ${round1(patternSum(pattern))} h/Woche`));
}

function phasesSection(board) {
  const cfg = board.config;
  const globalPattern = cfg.availableDays || [];
  const heads = [{ label: "Phase" }, { label: "Start" }, { label: "Ende" }, { label: "Std./Woche" }, { label: "Budget (auto)" }];

  const items = cfg.phases.map((p, i) => {
    const override = p.availableDays || [];
    const effective = override.length ? override : globalPattern;
    const usesPattern = effective.length > 0;

    const hoursCell = usesPattern
      ? readCell(`${round1(patternSum(effective))} h`,
        override.length ? "Summe der Phasen-Lerntage" : "Summe der globalen Lerntage")
      : inp(p.hoursPerWeek, "h/Woche", (v) => updateItem("phases", i, "hoursPerWeek", parseFloat(v) || 0), "number");

    const row = editableRow([
      inp(p.label, "Phase", (v) => updateItem("phases", i, "label", v)),
      inp(p.start, "Start", (v) => updateItem("phases", i, "start", v), "date"),
      inp(p.end, "Ende", (v) => updateItem("phases", i, "end", v), "date"),
      hoursCell,
      readCell(`${round1(phaseBudgetHours(p, board))} h`, "Verfügbare Stunden (Kapazität abzüglich Sperren)"),
    ], () => removeItem("phases", i));

    const adv = h("details", { class: "phase-adv", open: override.length > 0 },
      h("summary", {}, "Erweiterte Optionen: eigene Lerntage"),
      h("p", { class: "muted setting-hint" }, override.length
        ? "Eigene Lerntage aktiv (überschreibt global). Alle Tage abwählen = erbt wieder global."
        : "Leer = erbt globale Lerntage. Tage wählen, um für diese Phase abzuweichen."),
      dayPatternEditor(override, (next) => updateItem("phases", i, "availableDays", next)));

    return h("div", { class: "phase-item" }, row, adv);
  });

  return h("section", { class: "settings-block" },
    h("h2", {}, "Phasen"),
    cfg.phases.length ? colHeads(heads) : null,
    h("div", { class: "rows" }, items),
    h("button", {
      class: "btn sm",
      onclick: () => addItem("phases", { id: uid("phase"), label: "Neue Phase", start: "", end: "", hoursPerWeek: 4, availableDays: [], color: "" }),
    }, "+ Hinzufügen"));
}

function listSection(title, items, rowFn, onAdd, heads) {
  return h("section", { class: "settings-block" },
    h("h2", {}, title),
    heads && items.length ? colHeads(heads) : null,
    h("div", { class: "rows" }, items.map(rowFn)),
    h("button", { class: "btn sm", onclick: onAdd }, "+ Hinzufügen"));
}

// Spaltenüberschriften, ausgerichtet auf editableRow (flex:1 bzw. feste Breite).
function colHeads(cols) {
  return h("div", { class: "edit-row heads" },
    cols.map((c) => h("span", { style: c.w ? { flex: `0 0 ${c.w}px` } : { flex: "1" } }, c.label)),
    h("span", { class: "head-spacer" }));
}

function editableRow(controls, onDelete) {
  return h("div", { class: "edit-row" }, ...controls,
    h("button", { class: "icon-del", title: "Entfernen", onclick: onDelete }, "×"));
}

function inp(value, ph, onCommit, type = "text") {
  const input = h("input", { type, value: value == null ? "" : value, placeholder: ph });
  input.addEventListener("change", () => onCommit(input.value));
  return input;
}

// Schreibgeschützte, abgeleitete Zelle (z. B. dynamisches Budget).
function readCell(text, title) {
  return h("span", { class: "read-cell", title: title || "" }, text);
}

function round1(n) {
  return Math.round((n || 0) * 10) / 10;
}

function color(value, onCommit) {
  const input = h("input", { type: "color", value: value || "#2563EB" });
  input.addEventListener("change", () => onCommit(input.value));
  return input;
}

function updateItem(coll, i, key, value) {
  store.commit((b) => { b.config[coll][i][key] = value; });
}
function addItem(coll, item) {
  store.commit((b) => b.config[coll].push(item));
}
function removeItem(coll, i) {
  store.commit((b) => b.config[coll].splice(i, 1));
}

function blockerSection(board) {
  return h("section", { class: "settings-block" },
    h("h2", {}, "Termine / Sperren (Stundenausfall)"),
    (board.blockers || []).length ? colHeads([{ label: "Anlass" }, { label: "Von" }, { label: "Bis" }]) : null,
    h("div", { class: "rows" }, (board.blockers || []).map((bl, i) => editableRow([
      inp(bl.label, "Anlass", (v) => store.commit((b) => { b.blockers[i].label = v; })),
      inp(bl.start, "Von", (v) => store.commit((b) => { b.blockers[i].start = v; }), "date"),
      inp(bl.end, "Bis", (v) => store.commit((b) => { b.blockers[i].end = v; }), "date"),
    ], () => store.commit((b) => b.blockers.splice(i, 1))))),
    h("button", { class: "btn sm", onclick: () => store.commit((b) => b.blockers.push({ id: uid("blk"), label: "Ausfall", start: "", end: "" })) }, "+ Sperre"));
}

function peopleSection(board) {
  const name = h("input", { type: "text", placeholder: "Name" });
  return h("section", { class: "settings-block" },
    h("h2", {}, "Personen"),
    (board.people || []).length ? colHeads([{ label: "Name" }, { label: "Farbe", w: 44 }]) : null,
    h("div", { class: "rows" }, (board.people || []).map((p, i) => editableRow([
      inp(p.name, "Name", (v) => store.commit((b) => { b.people[i].name = v; })),
      color(p.color, (v) => store.commit((b) => { b.people[i].color = v; })),
    ], () => store.commit((b) => b.people.splice(i, 1))))),
    h("div", { class: "panel-row" }, name,
      h("button", {
        class: "btn sm", onclick: () => {
          if (!name.value.trim()) return;
          store.commit((b) => b.people.push({ id: uid("p"), name: name.value.trim(), color: "#2563EB" }));
        },
      }, "+ Person")));
}

function rawJsonSection(board) {
  const ta = h("textarea", { class: "mono", rows: "10" }, JSON.stringify(board, null, 2));
  return h("section", { class: "settings-block" },
    h("h2", {}, "Roh-JSON"),
    h("p", { class: "muted" }, "Gesamtes Board als JSON. Änderungen werden validiert übernommen."),
    ta,
    h("button", {
      class: "btn", onclick: () => {
        try {
          store.replaceBoard(JSON.parse(ta.value));
          toast("Übernommen");
        } catch (e) { toast("Ungültiges JSON: " + e.message); }
      },
    }, "JSON übernehmen"));
}

  return { renderSettings };
})();

const __M_import_export = (function(){
  const { store } = __M_store;
  const { toast } = __M_dom;
  const { parseBoard } = __M_model;
  const { escapeDataIsland } = __M_serialize;
// Import/Export aus der GUI:
//  - JSON-Import (Datei) mit Validierung vor Übernahme (kein State-Verlust bei Fehler)
//  - JSON-Export des aktuellen Boards
//  - Onepager-Export: klont das laufende Dokument und tauscht nur die Daten-Insel
//    -> exakt dieselbe, voll interaktive App mit aktuellem Stand
//  - Demo laden (same-origin fetch)


function download(filename, text, type = "application/json") {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function slugTitle() {
  return (store.getBoard().config.title || "board")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "board";
}

function exportJson() {
  download(`${slugTitle()}.json`, JSON.stringify(store.getBoard(), null, 2));
  toast("JSON exportiert");
}

function importFromText(text) {
  let board;
  try {
    board = parseBoard(text); // safeParse + Migration + Sanitisierung + Validierung
  } catch (e) {
    toast("Import fehlgeschlagen: " + e.message);
    return false;
  }
  store.replaceBoard(board);
  toast("Import erfolgreich");
  return true;
}

function importFromFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => importFromText(String(e.target.result));
  reader.onerror = () => toast("Datei konnte nicht gelesen werden");
  reader.readAsText(file);
}

function loadDemo() {
  // Demo ist als separate Daten-Insel eingebettet (nur in der gehosteten App).
  const el = document.getElementById("demo-data");
  if (!el || !el.textContent.trim()) {
    toast("Demo nur in der gehosteten Version verfügbar");
    return;
  }
  importFromText(el.textContent);
}

/**
 * Erzeugt eine self-contained Onepager-HTML aus dem laufenden Dokument:
 * klont den DOM, leert die Laufzeit-Knoten (#app, Dialoge) und ersetzt die
 * Daten-Insel durch den aktuellen Board-Stand. Das eingebettete Script bleibt
 * unverändert -> CSP-Hash gültig, App voll funktionsfähig.
 */
function buildOnepagerHtml() {
  const island = document.getElementById("board-data");
  if (!island) return null; // nur im gebauten Single-File vorhanden
  const root = document.documentElement.cloneNode(true);

  const app = root.querySelector("#app");
  if (app) app.innerHTML = "";
  root.querySelector("#dlg")?.remove();
  root.querySelector("#toast")?.remove();
  // Demo gehört nur in die gehostete App, nicht in den exportierten Onepager.
  root.querySelector("#demo-data")?.remove();

  const clonedIsland = root.querySelector("#board-data");
  clonedIsland.textContent = escapeDataIsland(JSON.stringify(store.getBoard()));

  return "<!DOCTYPE html>\n" + root.outerHTML;
}

function exportOnepager() {
  const html = buildOnepagerHtml();
  if (!html) {
    toast("Onepager-Export nur in der gebauten Datei verfügbar");
    return;
  }
  download(`${slugTitle()}-onepager.html`, html, "text/html");
  toast("Onepager exportiert");
}

  return { exportJson, importFromText, importFromFile, loadDemo, buildOnepagerHtml, exportOnepager };
})();

const __M_app = (function(){

// Bootstrap & Grundgerüst: Header, Timer-Banner, Tabs, Toolbar, View-Routing.
// Entry-Modul: der Build-Bootstrap ruft start() auf.


const VIEWS = [
  { id: "kanban", label: "Kanban" },
  { id: "gantt", label: "Zeitplan" },
  { id: "settings", label: "Einstellungen" },
];

let mount, headerEl, headerTextEl, headerAsideEl, timerEl, tabsEl, toolbarEl;
let timerInterval = null;

function start() {
  store.init();

  // Auf schmalen Viewports den Zeitplan standardmäßig als Liste zeigen
  // (Gantt erzwingt 960px -> nur Horizontal-Scroll). Nutzer kann jederzeit umschalten.
  try {
    if (window.matchMedia && window.matchMedia("(max-width: 640px)").matches) {
      store.scheduleView = "list";
    }
  } catch (e) { /* matchMedia nicht verfügbar -> Default "chart" */ }

  const app = document.getElementById("app");
  clear(app);

  headerEl = h("header", { class: "app-header" });
  headerTextEl = h("div", { class: "app-header-text" });
  headerAsideEl = h("div", { class: "app-header-aside" });
  timerEl = h("div", { id: "timerBanner" });
  headerAsideEl.append(timerEl); // Timer kompakt oben rechts, neben dem Link
  headerEl.append(headerTextEl, headerAsideEl);
  tabsEl = h("div", { class: "tabs" });
  toolbarEl = h("div", { class: "toolbar" });
  mount = h("main", { id: "viewMount" });

  app.append(headerEl, tabsEl, toolbarEl, mount);

  renderProjectLinks();
  buildTabs();
  store.subscribe(render);
  render();
  startTimerTick();

// Projekt-Verweise. "Ein eigenes Board erstellen" sitzt im Header-Fluss oben rechts
// (neben dem Timer) -> überlappt nichts. Fork-Ribbon nur in der gehosteten Demo
// (erkennbar an der eingebetteten Demo-Insel, gleiches Gate wie der Demo-Button).
function renderProjectLinks() {
  const onDemo = !!document.getElementById("demo-data");

  if (onDemo) {
    document.body.appendChild(
      h("a", {
        class: "fork-ribbon",
        href: "https://github.com/jbtls/project-board",
        target: "_blank", rel: "noopener noreferrer",
        "aria-label": "Projekt auf GitHub ansehen",
      }, "Auf GitHub ansehen")
    );
  }

  headerAsideEl.appendChild(
    h("a", {
      class: "own-board-link",
      href: "https://jbtls.github.io/project-board/",
      target: "_blank", rel: "noopener noreferrer",
    }, "＋ Ein eigenes Board erstellen")
  );
}

function buildTabs() {
  clear(tabsEl);
  for (const v of VIEWS) {
    tabsEl.appendChild(
      h("button", {
        class: "tab" + (store.view === v.id ? " active" : ""),
        onclick: () => store.setView(v.id),
        dataset: { view: v.id },
      }, v.label)
    );
  }
}

function renderHeader() {
  const cfg = store.getBoard().config;
  clear(headerTextEl); // nur den Text-Teil neu rendern; Aside (Timer/Link) bleibt
  headerTextEl.append(
    h("h1", {}, cfg.title || "Lern-Kanban"),
    cfg.subtitle ? h("div", { class: "sub" }, cfg.subtitle) : null
  );
}

function renderTimerBanner() {
  clear(timerEl);
  const { taskId, start: ts } = store.timer;
  if (!taskId || !ts) { timerEl.style.display = "none"; return; }
  const t = store.getBoard().tasks.find((x) => x.id === taskId);
  timerEl.style.display = "flex";
  const sec = Math.round((Date.now() - ts) / 1000);
  const mm = Math.floor(sec / 60), ss = String(sec % 60).padStart(2, "0");
  timerEl.append(
    h("span", { class: "elapsed" }, `⏱ ${mm}:${ss}`),
    h("strong", { class: "tb-title", title: t ? t.title : "" }, t ? t.title : ""),
    h("button", { class: "stop-btn", title: "Timer stoppen", "aria-label": "Timer stoppen", onclick: () => store.stopTimer() }, "⏹")
  );
}

function startTimerTick() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => { if (store.timer.taskId) renderTimerBanner(); }, 1000);
}

function renderToolbar() {
  clear(toolbarEl);
  if (store.view === "settings") return; // Einstellungen brauchen keine Filter

  const board = store.getBoard();
  const search = h("input", {
    class: "search", type: "text", placeholder: "Suche (Titel, Inhalt, ID)…",
    value: store.filters.q,
    // Nur die Inhaltsansicht neu rendern (nicht die Toolbar) -> Fokus bleibt.
    oninput: (e) => { store.filters.q = e.target.value; renderView(); },
  });

  const catChips = h("div", { class: "chips" },
    chip("Alle", store.filters.category === "all", () => store.setFilter({ category: "all" })),
    board.config.categories.map((c) =>
      chip(c.prefix || c.label, store.filters.category === c.id,
        () => store.setFilter({ category: c.id }), c.color, c.label))
  );

  const phaseChips = h("div", { class: "chips" },
    board.config.phases.map((p) =>
      chip(p.label, store.filters.phase === p.id,
        () => store.setFilter({ phase: store.filters.phase === p.id ? "all" : p.id })))
  );

  // Demo-Button nur in der gehosteten Variante (eingebettete Demo-Insel vorhanden)
  const demoAvailable = !!document.getElementById("demo-data");

  const items = [
    search, catChips,
    h("span", { class: "filter-sep", "aria-hidden": "true" }),
    phaseChips,
    h("div", { class: "spacer" }),
    store.view === "gantt" ? scheduleToggle() : null,
    demoAvailable ? h("button", { class: "btn", onclick: () => loadDemo() }, "Demo laden") : null,
    h("button", { class: "btn", onclick: () => pickFile() }, "Import"),
    exportMenu(),
  ].filter(Boolean);
  toolbarEl.append(...items);

function exportMenu() {
  const details = h("details", { class: "menu" });
  const summary = h("summary", { class: "btn pri" }, "Export ▾");
  const close = () => { details.open = false; };
  details.append(summary,
    h("div", { class: "menu-list" },
      h("button", { class: "menu-item", onclick: () => { close(); exportJson(); } }, "Als JSON"),
      h("button", { class: "menu-item", onclick: () => { close(); exportOnepager(); } }, "Als Onepager (HTML)")));
  return details;
}

function chip(label, on, onclick, color, title) {
  const attrs = { class: "chip" + (on ? " on" : ""), onclick };
  if (title) attrs.title = title;
  if (on && color) attrs.style = { background: color, borderColor: color, color: "#fff" };
  return h("button", attrs, label);
}

function pickFile() {
  const input = h("input", { type: "file", accept: ".json", style: { display: "none" } });
  input.addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) importFromFile(f);
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(() => input.remove(), 1000);
}

// Segmented-Toggle Gantt <-> Liste für den Zeitplan-Tab.
function scheduleToggle() {
  const seg = (id, label) => h("button", {
    class: "seg-btn" + (store.scheduleView === id ? " on" : ""),
    onclick: () => store.setScheduleView(id),
  }, label);
  return h("div", { class: "seg-toggle" }, seg("chart", "Gantt"), seg("list", "Liste"));
}

// Nur die Inhaltsansicht (ohne Header/Toolbar) — für fokuserhaltende Updates.
function renderView() {

  else if (store.view === "gantt") {
    if (store.scheduleView === "list") renderList(mount);

  else if (store.view === "settings") renderSettings(mount);
